<main class="page">
  <h1>Explorador do dataset de EPIs</h1>

  @if (datasetService.loading()) {
    <p>Carregando...</p>
  }

  @if (datasetService.error(); as message) {
    <p role="alert">{{ message }}</p>
  }

  @if (datasetService.dataset()) {
    <app-image-gallery [items]="datasetService.galleryItems()" />
  }
</main>
